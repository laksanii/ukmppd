{i:72,t:"statusep",q:"Perempuan 35 tahun dibawa ke IGD dengan kejang yang berlangsung sekitar 12 menit dan belum berhenti. Berat badan 50 kg. Apakah tatalaksana yang paling tepat?",
o:["Fenitoin 20 mg/kgBB","Diazepam 0,15 mg/kgBB intravena","Asam valproat 1.000 mg oral","Manitol 0,5 g/kgBB","Piridostigmin intravena"],a:1,
e:"Bila durasi kejang kurang dari 30 menit, diberikan lorazepam 0,1 mg/kgBB atau diazepam 0,15 mg/kgBB. Fenitoin 20 mg/kgBB diberikan bila kejang melebihi 30 menit.",
w:["Fenitoin dipilih bila kejang sudah melewati 30 menit.","Benar. Kejang kurang dari 30 menit diberikan diazepam 0,15 mg/kgBB atau lorazepam 0,1 mg/kgBB.","Obat oral tidak dapat diberikan saat pasien kejang.","Manitol untuk peningkatan tekanan intrakranial.","Piridostigmin untuk miastenia gravis."]},

{i:73,t:"statusep",q:"Manakah pernyataan yang paling tepat mengenai status epileptikus konvulsif?",
o:["Bangkitan dengan durasi lebih dari 5 menit atau bangkitan berulang dua kali atau lebih tanpa pulihnya kesadaran di antara bangkitan","Bangkitan berupa perubahan kesadaran tanpa manifestasi motorik yang jelas","Kejang tunggal yang berhenti sendiri dalam 2 menit dengan kesadaran pulih penuh","Kejang yang selalu didahului demam tinggi pada anak","Kejang yang hanya terjadi saat tidur"],a:0,
e:"Status epileptikus konvulsif adalah bangkitan dengan durasi lebih dari 5 menit atau bangkitan berulang dua kali atau lebih tanpa pulihnya kesadaran di antara bangkitan. Status epileptikus non konvulsif berupa perubahan kesadaran atau perilaku tanpa manifestasi motorik jelas, namun EEG menunjukkan aktivitas bangkitan elektrografik.",
w:["Benar. Ini definisi status epileptikus konvulsif.","Ini definisi status epileptikus non konvulsif.","Kejang yang berhenti sendiri dengan kesadaran pulih bukan status epileptikus.","Ini menggambarkan kejang demam.","Waktu kejadian kejang tidak menentukan definisi status epileptikus."]},

{i:74,t:"spina",q:"Bayi baru lahir tampak benjolan di daerah punggung bawah berupa kantong kistik berisi cairan yang menonjol melalui celah pada arkus vertebra. Pemeriksaan menunjukkan gerakan kedua tungkai normal, tonus baik, dan tidak ada gangguan berkemih. Isi kantong hanya berupa selaput dura dan araknoid tanpa jaringan saraf. Apakah diagnosis yang paling tepat?",
o:["Spina bifida okulta","Meningokel","Mielomeningokel","Mieloskisis","Ensefalokel"],a:1,
e:"Meningokel adalah pembesaran kistik dari dura dan araknoid yang berprotrusi melalui defek pada arkus vertebra, tanpa jaringan medula spinalis, sehingga umumnya tidak disertai defisit neurologis.",
w:["Spina bifida okulta tidak membentuk benjolan kistik dan sering tanpa gejala.","Benar. Kantong berisi dura dan araknoid saja tanpa jaringan saraf = meningokel.","Mielomeningokel isinya ikut mengandung jaringan medula spinalis sehingga ada defisit neurologis.","Mieloskisis berarti korda spinalis terekspos di permukaan punggung tanpa terbungkus selaput.","Ensefalokel terjadi di kepala, bukan tulang belakang."]},

{i:75,t:"spina",q:"Bayi baru lahir dengan benjolan di punggung bawah. Pada pemeriksaan, jaringan medula spinalis ikut terekstensi ke dalam kantong, dan bayi menunjukkan kelemahan kedua tungkai serta rembesan urin terus-menerus. Apakah diagnosis yang paling tepat?",
o:["Spina bifida okulta","Meningokel","Mielomeningokel","Mieloskisis","Lipoma spinalis"],a:2,
e:"Mielomeningokel adalah kondisi ketika jaringan medula spinalis ikut terekstensi ke dalam meningokel, sehingga disertai defisit neurologis seperti kelemahan tungkai dan gangguan berkemih.",
w:["Spina bifida okulta tidak memberi benjolan dan sering tanpa defisit.","Meningokel isinya hanya dura dan araknoid sehingga umumnya tanpa defisit neurologis.","Benar. Jaringan medula spinalis ikut masuk kantong dan menimbulkan defisit neurologis.","Pada mieloskisis korda spinalis terekspos tanpa terbungkus selaput sama sekali.","Lipoma spinalis berupa massa lemak, bukan herniasi meningen."]},

{i:76,t:"spina",q:"Seorang ibu hamil datang untuk konseling prakonsepsi. Ia memiliki riwayat epilepsi dan mengonsumsi asam valproat. Dokter menjelaskan risiko defek penutupan tabung saraf pada janin. Selain penggantian obat, apakah faktor penyebab lain spina bifida yang paling penting untuk dicegah?",
o:["Kekurangan asam folat","Kelebihan vitamin A","Kekurangan zat besi","Kelebihan yodium","Kekurangan vitamin D"],a:0,
e:"Etiologi spina bifida meliputi faktor genetik, kekurangan asam folat, efek samping asam valproat, dan konsumsi alkohol. Suplementasi asam folat prakonsepsi adalah pencegahan utamanya.",
w:["Benar. Defisiensi asam folat adalah penyebab yang paling dapat dicegah.","Kelebihan vitamin A bersifat teratogenik namun bukan penyebab utama spina bifida.","Kekurangan zat besi menyebabkan anemia, bukan defek tabung saraf.","Kelebihan yodium tidak berkaitan dengan spina bifida.","Kekurangan vitamin D berkaitan dengan gangguan tulang, bukan defek tabung saraf."]},

{i:77,t:"nervus",q:"Laki-laki 30 tahun mengalami patah tulang humerus setelah kecelakaan. Setelah pemasangan bidai, pasien mengeluh tidak dapat mengangkat pergelangan tangan kanan sehingga tangan tampak menggantung. Apakah nervus yang mengalami cedera?",
o:["Nervus radialis","Nervus medianus","Nervus ulnaris","Nervus aksilaris","Nervus muskulokutaneus"],a:0,

const TOPICS = {
  kepala:"Nyeri kepala", trigeminal:"Neuralgia trigeminal", motorik:"Kekuatan motorik",
  bell:"Bell's palsy", stroke:"Stroke", iskemik:"Sistem vaskular & TIA", vertigo:"Vertigo",
  parkinson:"Parkinson", nmj:"Miastenia gravis & GBS", polio:"Poliomielitis",
  meningitis:"Meningitis & ensefalitis", epilepsi:"Epilepsi", statusep:"Status epileptikus",
  spina:"Spina bifida", nervus:"Cedera nervus & CTS", hnp:"HNP", lainnya:"Elbow syndrome & DMD"
};
const LET = ["A","B","C","D","E"];
const $ = id => document.getElementById(id);

/* ---------------- penyimpanan ---------------- */
/* Tiga tingkat, dipilih otomatis sesuai tempat file ini dibuka:
   1. window.storage  - saat berjalan sebagai artifact di dalam Claude
   2. localStorage    - saat file di-host sendiri atau dibuka langsung dari disk
   3. memori          - kalau dua-duanya diblokir; progres hanya bertahan selama tab terbuka */
const mem = {};
function localOK(){
  try{
    const t = "neuro:__t";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
const store = {
  mode: (typeof window !== "undefined" && window.storage) ? "claude" : (localOK() ? "local" : "mem"),
  async get(k, dflt){
    try{
      if(this.mode === "claude"){
        const r = await window.storage.get(k);
        return r ? JSON.parse(r.value) : dflt;
      }
      if(this.mode === "local"){
        const r = window.localStorage.getItem(k);
        return r === null ? dflt : JSON.parse(r);
      }
    }catch(e){ return k in mem ? mem[k] : dflt; }
    return k in mem ? mem[k] : dflt;
  },
  async set(k, v){
    mem[k] = v;
    try{
      if(this.mode === "claude") await window.storage.set(k, JSON.stringify(v));
      else if(this.mode === "local") window.localStorage.setItem(k, JSON.stringify(v));
    }catch(e){}
  },
  async del(k){
    delete mem[k];
    try{
      if(this.mode === "claude") await window.storage.delete(k);
      else if(this.mode === "local") window.localStorage.removeItem(k);
    }catch(e){}
  }
};

/* ---------------- konfigurasi ---------------- */
const DEFAULT_CFG = {
  topics: Object.keys(TOPICS),
  count: 20,
  fb: true,        // pembahasan
  timer: false,    // timer
  track: true,     // simpan progres
  review: true,    // kumpulkan & tinjau soal salah
  secPerQ: 80
};
let cfg = {...DEFAULT_CFG};
let hist = [];
let wrongSet = {};

const TOGGLE_DEFS = [
  {k:"fb",     nm:"Pembahasan tiap soal",   ds:"Jawaban benar dan alasan tiap pilihan langsung muncul setelah kamu menjawab."},
  {k:"timer",  nm:"Timer",                  ds:"Hitung mundur seperti simulasi ujian. Sesi berakhir sendiri saat waktu habis."},
  {k:"track",  nm:"Simpan skor & progres",  ds:"Riwayat sesi dan capaian per materi tersimpan untuk sesi berikutnya."},
  {k:"review", nm:"Kumpulkan soal salah",   ds:"Soal yang kamu jawab salah bisa ditinjau di akhir dan diulang jadi sesi tersendiri."}
];

/* ---------------- state sesi ---------------- */
let S = null;

/* ---------------- setup ---------------- */
function renderTopics(){
  const counts = {};
  BANK.forEach(q => counts[q.t] = (counts[q.t]||0)+1);
  $("topics").innerHTML = Object.keys(TOPICS).map(k => {
    const on = cfg.topics.includes(k);
    return `<label class="topic${on?" on":""}" data-t="${k}">
      <input type="checkbox" ${on?"checked":""} data-t="${k}">
      <span class="nm">${TOPICS[k]}</span>
      <span class="ct">${counts[k]}</span>
    </label>`;
  }).join("");
  $("topics").querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      const t = inp.dataset.t;
      cfg.topics = inp.checked ? [...new Set([...cfg.topics, t])] : cfg.topics.filter(x => x !== t);
      inp.closest(".topic").classList.toggle("on", inp.checked);
      saveCfg(); renderPool();
    });
  });
}

function poolSize(){ return BANK.filter(q => cfg.topics.includes(q.t)).length; }

function renderPool(){
  const n = poolSize();
  const el = $("pool");
  $("count").max = Math.max(1, n);
  if(n === 0){
    el.className = "pool warn";
    el.innerHTML = "Belum ada materi yang dipilih. Pilih minimal satu untuk mulai.";
  } else {
    el.className = "pool";
    const use = Math.min(cfg.count, n);
    el.innerHTML = `Tersedia <b>${n}</b> soal dari materi yang dipilih. Sesi ini akan memakai <b>${use}</b> soal, diacak.`;
  }
  $("presets").querySelectorAll(".chip").forEach(c => {
    const v = c.dataset.v === "all" ? n : +c.dataset.v;
    c.classList.toggle("on", v === cfg.count || (c.dataset.v === "all" && cfg.count >= n && n > 0));
  });
  $("start").disabled = n === 0;
  $("start").textContent = n === 0 ? "Pilih materi dulu" : `Mulai latihan · ${Math.min(cfg.count, n)} soal`;
}

function renderPresets(){
  $("presets").innerHTML = [10,20,30,50,"all"].map(v =>
    `<button class="chip" data-v="${v}">${v==="all"?"Semua":v}</button>`).join("");
  $("presets").querySelectorAll(".chip").forEach(c => {
    c.addEventListener("click", () => {
      cfg.count = c.dataset.v === "all" ? poolSize() : +c.dataset.v;
      $("count").value = cfg.count; saveCfg(); renderPool();
    });
  });
}

function renderToggles(){
  $("toggles").innerHTML = TOGGLE_DEFS.map(t => `
    <div class="tg">
      <div class="tg-txt">
        <p class="nm">${t.nm}</p>
        <p class="ds">${t.ds}</p>
        ${t.k === "timer" ? `<div class="tg-sub" id="secWrap">
            <label for="secPerQ">Waktu per soal</label>
            <input type="number" id="secPerQ" min="10" max="600" value="${cfg.secPerQ}">
            <span>detik</span></div>` : ""}
      </div>
      <button class="sw${cfg[t.k]?" on":""}" data-k="${t.k}" role="switch"
        aria-checked="${cfg[t.k]}" aria-label="${t.nm}"></button>
    </div>`).join("");
  $("toggles").querySelectorAll(".sw").forEach(b => {
    b.addEventListener("click", () => {
      const k = b.dataset.k;
      cfg[k] = !cfg[k];
      b.classList.toggle("on", cfg[k]);
      b.setAttribute("aria-checked", cfg[k]);
      if(k === "timer") $("secWrap").style.display = cfg.timer ? "" : "none";
      if(k === "track" || k === "review") renderHistory();
      saveCfg();
    });
  });
  $("secWrap").style.display = cfg.timer ? "" : "none";
  $("secPerQ").addEventListener("change", e => {
    cfg.secPerQ = Math.max(10, Math.min(600, +e.target.value || 80));
    e.target.value = cfg.secPerQ; saveCfg();
  });
}

function renderHistory(){
  const body = $("histBody");
  const nWrong = Object.keys(wrongSet).length;
  $("startWrong").classList.toggle("hidden", !(cfg.review && nWrong > 0));
  if(cfg.review && nWrong > 0) $("startWrong").textContent = `Ulangi ${nWrong} soal yang pernah salah`;

  if(!cfg.track){
    $("clearHist").classList.add("hidden");
    body.innerHTML = `<p class="empty">Penyimpanan progres sedang dimatikan, jadi sesi ini tidak akan dicatat.</p>`;
    return;
  }
  if(!hist.length){
    $("clearHist").classList.add("hidden");
    body.innerHTML = `<p class="empty">Belum ada sesi tercatat. Skor dan capaian per materi akan muncul di sini setelah sesi pertama.</p>`;
    return;
  }
  $("clearHist").classList.remove("hidden");
  const rows = hist.slice(0,6).map(h => {
    const pc = Math.round(h.correct/h.total*100);
    return `<div class="hrow">
      <span class="dt">${h.date} · ${h.total} soal</span>
      <span class="sc">${h.correct}/${h.total} · ${pc}%</span></div>`;
  }).join("");
  const agg = {};
  hist.forEach(h => Object.entries(h.byTopic||{}).forEach(([k,v]) => {
    agg[k] = agg[k] || {c:0,t:0}; agg[k].c += v.c; agg[k].t += v.t;
  }));
  const weak = Object.entries(agg).filter(([,v]) => v.t >= 3)
    .map(([k,v]) => ({k, pc: v.c/v.t})).sort((a,b) => a.pc - b.pc).slice(0,3);
  const weakHtml = weak.length
    ? `<p class="note">Materi dengan capaian terendah sejauh ini: ${weak.map(w =>
        `${TOPICS[w.k]} (${Math.round(w.pc*100)}%)`).join(", ")}.</p>` : "";
  body.innerHTML = `<div class="hist">${rows}</div>${weakHtml}`;
}

function saveCfg(){ store.set("neuro:cfg", cfg); }

/* ---------------- mulai sesi ---------------- */
function shuffle(a){
  const r = [...a];
  for(let i = r.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; }
  return r;
}

function startSession(pool, label){
  const n = Math.min(cfg.count, pool.length);
  const qs = shuffle(pool).slice(0, n);
  S = {
    qs, label, i: 0,
    ans: new Array(n).fill(null),
    flags: new Array(n).fill(false),
    graded: cfg.fb,
    startedAt: Date.now(),
    left: cfg.timer ? n * cfg.secPerQ : null,
    tick: null, done: false
  };
  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  if(cfg.timer){
    S.tick = setInterval(() => {
      S.left--;
      renderClock();
      if(S.left <= 0){ clearInterval(S.tick); finishSession(true); }
    }, 1000);
  }
  renderQ();
  window.scrollTo(0,0);
}

/* ---------------- render soal ---------------- */
function renderClock(){
  const el = $("clock");
  if(!cfg.timer){ el.textContent = ""; return; }
  const m = Math.floor(Math.max(0,S.left)/60), s = Math.max(0,S.left)%60;
  el.textContent = `${m}:${String(s).padStart(2,"0")}`;
  el.classList.toggle("low", S.left <= 60);
}

function renderTrace(){
  const n = S.qs.length, W = 1000, base = 19, seg = W/n;
  let out = `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#B4B8AE" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  for(let i = 0; i < n; i++){
    const a = S.ans[i];
    if(a === null){
      if(S.flags[i]) out += `<circle cx="${i*seg+seg/2}" cy="${base}" r="2.4" fill="var(--nissl)"/>`;
      continue;
    }
    const xc = i*seg + seg/2, w = seg;
    let col, pts;
    if(S.graded || S.done){
      const right = a === S.qs[i].a;
      col = right ? "var(--ok)" : "var(--no)";
      const peak = right ? base-14 : base+14;
      const dip  = right ? base+4  : base-4;
      pts = `${i*seg},${base} ${xc-w*.3},${base} ${xc-w*.16},${dip} ${xc},${peak} ${xc+w*.16},${dip} ${xc+w*.3},${base} ${(i+1)*seg},${base}`;
    } else {
      col = "var(--nissl)";
      pts = `${i*seg},${base} ${xc-w*.22},${base} ${xc},${base-9} ${xc+w*.22},${base} ${(i+1)*seg},${base}`;
    }
    out += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  }
  const cx = S.i*seg + seg/2;
  out += `<line x1="${cx}" y1="2" x2="${cx}" y2="36" stroke="var(--myelin)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity=".55"/>`;
  $("trace").innerHTML = out;
}

function renderQ(){
  const q = S.qs[S.i], picked = S.ans[S.i], show = S.graded && picked !== null;
  $("qnum").textContent = `Soal ${S.i+1} / ${S.qs.length}`;
  $("qtopic").textContent = TOPICS[q.t];
  renderClock();
  renderTrace();
  $("vignette").textContent = q.q;
  $("opts").innerHTML = q.o.map((o,k) => {
    let cls = "opt";
    if(show){
      if(k === q.a) cls += " right";
      else if(k === picked) cls += " wrong";
    } else if(k === picked) cls += " picked";
    return `<button class="${cls}" data-k="${k}" ${show?"disabled":""}>
      <span class="lt">${LET[k]}</span><span class="tx">${o}</span></button>`;
  }).join("");
  $("opts").querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => pick(+b.dataset.k)));

  if(show){
    const right = picked === q.a;
    $("fb").classList.remove("hidden");
    $("fbTop").className = "fb-top " + (right ? "ok" : "no");
    $("fbTop").textContent = right
      ? `Benar — jawaban ${LET[q.a]}`
      : `Kurang tepat — jawaban yang benar ${LET[q.a]}`;
    $("fbKey").textContent = q.e;
    $("fbWhy").innerHTML = q.w.map((w,k) =>
      `<div class="why-row${k===q.a?" k":""}"><span class="lt">${LET[k]}</span><span>${w}</span></div>`).join("");
  } else {
    $("fb").classList.add("hidden");
  }

  $("prev").disabled = S.i === 0;
  $("next").textContent = S.i === S.qs.length-1 ? "Lihat hasil" : "Berikutnya";
  const f = $("flag");
  f.classList.toggle("flagged", S.flags[S.i]);
  f.textContent = S.flags[S.i] ? "Ditandai ragu" : "Tandai ragu";
}

function pick(k){
  if(S.graded && S.ans[S.i] !== null) return;
  S.ans[S.i] = k;
  renderQ();
}

function move(d){
  const ni = S.i + d;
  if(ni < 0) return;
  if(ni >= S.qs.length){ finishSession(false); return; }
  S.i = ni; renderQ(); window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------------- selesai & hasil ---------------- */
function finishSession(byTimer){
  if(S.tick) clearInterval(S.tick);
  S.done = true;
  S.elapsed = Math.round((Date.now() - S.startedAt)/1000);
  S.byTimer = !!byTimer;

  const byTopic = {};
  let correct = 0, answered = 0;
  S.qs.forEach((q,i) => {
    const a = S.ans[i];
    byTopic[q.t] = byTopic[q.t] || {c:0, t:0};
    byTopic[q.t].t++;
    if(a !== null){
      answered++;
      if(a === q.a){ correct++; byTopic[q.t].c++; }
    }
  });
  S.correct = correct; S.answered = answered; S.byTopic = byTopic;

  if(cfg.review){
    S.qs.forEach((q,i) => {
      if(S.ans[i] !== null && S.ans[i] !== q.a) wrongSet[q.i] = true;
      else if(S.ans[i] === q.a) delete wrongSet[q.i];
    });
    store.set("neuro:wrong", wrongSet);
  }
  if(cfg.track){
    const d = new Date();
    hist.unshift({
      date: `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`,
      total: S.qs.length, correct, byTopic, sec: S.elapsed
    });
    hist = hist.slice(0,50);
    store.set("neuro:hist", hist);
  }
  renderResult();
}

function fmtDur(s){
  const m = Math.floor(s/60);
  return m >= 1 ? `${m} menit ${s%60} detik` : `${s} detik`;
}

function renderResult(){
  const n = S.qs.length, pc = Math.round(S.correct/n*100);
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("scBig").textContent = `${pc}%`;
  $("scOf").textContent = `${S.correct} benar dari ${n} soal`;

  let v;
  if(S.byTimer) v = "Waktu habis sebelum semua soal terjawab. ";
  else v = "";
  if(pc >= 85) v += "Penguasaan materinya sudah kuat. Pertahankan dengan pengulangan berkala, dan mulai campur materi lain supaya terbiasa berpindah bidang.";
  else if(pc >= 66) v += "Sudah di atas ambang kelulusan, tapi belum ada jarak aman. Kejar materi yang capaiannya paling rendah di bawah ini.";
  else if(pc >= 50) v += "Separuh materi sudah masuk, separuh lagi belum. Baca ulang bab yang capaiannya di bawah 60 persen sebelum menambah soal baru.";
  else v += "Fondasinya masih perlu dibangun. Kembali ke materi dulu per bab, baru latihan soal per bab yang sama, jangan langsung sesi campuran.";
  $("verdict").textContent = v;

  const meta = [
    `Terjawab <b>${S.answered}</b> dari ${n}`,
    `Waktu <b>${fmtDur(S.elapsed)}</b>`,
    `Rata-rata <b>${Math.round(S.elapsed/n)} detik</b> per soal`
  ];
  const nf = S.flags.filter(Boolean).length;
  if(nf) meta.push(`Ditandai ragu <b>${nf}</b>`);
  $("scMeta").innerHTML = meta.map(m => `<span>${m}</span>`).join("");

  const entries = Object.entries(S.byTopic).sort((a,b) => (a[1].c/a[1].t) - (b[1].c/b[1].t));
  $("bars").innerHTML = entries.map(([k,v]) => {
    const p = Math.round(v.c/v.t*100);
    const cls = p >= 70 ? "" : p >= 50 ? " mid" : " low";
    return `<div class="bar">
      <div><span class="lbl">${TOPICS[k]}</span>
        <div class="track"><div class="fill${cls}" style="width:${p}%"></div></div></div>
      <span class="pc">${v.c}/${v.t}</span></div>`;
  }).join("");

  S.revWrongOnly = cfg.review;
  renderReview();

  const nWrong = S.qs.filter((q,i) => S.ans[i] !== null && S.ans[i] !== q.a).length;
  const rw = $("retryWrong");
  rw.classList.toggle("hidden", !(cfg.review && nWrong > 0));
  rw.textContent = `Ulangi ${nWrong} soal yang salah tadi`;
  window.scrollTo(0,0);
}

function renderReview(){
  const only = S.revWrongOnly;
  const rows = S.qs.map((q,i) => ({q, i})).filter(({q,i}) =>
    !only || S.ans[i] === null || S.ans[i] !== q.a);
  $("revTitle").textContent = only ? "Soal yang belum tepat" : "Pembahasan semua soal";
  $("revToggle").textContent = only ? "Tampilkan semua soal" : "Tampilkan yang salah saja";
  $("revToggle").classList.toggle("hidden", !cfg.review);
  if(!rows.length){
    $("revBody").innerHTML = `<p class="empty">Tidak ada soal yang salah di sesi ini. Semua terjawab tepat.</p>`;
    return;
  }
  $("revBody").innerHTML = rows.map(({q,i}) => {
    const a = S.ans[i];
    const state = a === null ? "sk" : (a === q.a ? "ok" : "no");
    const label = a === null ? "Tidak dijawab" : (a === q.a ? "Benar" : "Salah");
    const yours = a === null ? "" :
      `<p class="rev-a">Jawabanmu <b>${LET[a]}. ${q.o[a]}</b></p>`;
    return `<div class="rev">
      <div class="rev-h">
        <span class="tag ${state}">${label}</span>
        <span class="n">Soal ${i+1} · ${TOPICS[q.t]}${S.flags[i]?" · ditandai ragu":""}</span>
      </div>
      <p class="rev-q">${q.q}</p>
      ${yours}
      <p class="rev-a">Kunci <b>${LET[q.a]}. ${q.o[q.a]}</b></p>
      <p class="rev-e">${q.e}</p>
    </div>`;
  }).join("");
}

/* ---------------- kontrol ---------------- */
$("selAll").addEventListener("click", () => { cfg.topics = Object.keys(TOPICS); saveCfg(); renderTopics(); renderPool(); });
$("selNone").addEventListener("click", () => { cfg.topics = []; saveCfg(); renderTopics(); renderPool(); });
$("count").addEventListener("input", e => {
  const n = poolSize();
  cfg.count = Math.max(1, Math.min(n || 89, +e.target.value || 1));
  saveCfg(); renderPool();
});
$("count").addEventListener("blur", e => { e.target.value = cfg.count; });

$("start").addEventListener("click", () => {
  const pool = BANK.filter(q => cfg.topics.includes(q.t));
  if(pool.length) startSession(pool, "campuran");
});
$("startWrong").addEventListener("click", () => {
  const pool = BANK.filter(q => wrongSet[q.i]);
  if(pool.length){ const keep = cfg.count; cfg.count = pool.length; startSession(pool, "ulang"); cfg.count = keep; }
});
$("clearHist").addEventListener("click", () => {
  hist = []; wrongSet = {};
  store.set("neuro:hist", hist);
  store.set("neuro:wrong", wrongSet);
  renderHistory();
});

$("prev").addEventListener("click", () => move(-1));
$("next").addEventListener("click", () => move(1));
$("flag").addEventListener("click", () => { S.flags[S.i] = !S.flags[S.i]; renderQ(); });
let finishArmed = false;
$("finish").addEventListener("click", () => {
  const un = S.ans.filter(a => a === null).length;
  if(un && !finishArmed){
    finishArmed = true;
    $("finish").textContent = `Masih ada ${un} soal kosong — klik lagi untuk menyelesaikan`;
    setTimeout(() => {
      finishArmed = false;
      $("finish").textContent = "Selesaikan sesi sekarang";
    }, 5000);
    return;
  }
  finishArmed = false;
  $("finish").textContent = "Selesaikan sesi sekarang";
  finishSession(false);
});

$("revToggle").addEventListener("click", () => { S.revWrongOnly = !S.revWrongOnly; renderReview(); });
$("again").addEventListener("click", () => {
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");
  renderTopics(); renderPool(); renderHistory();
  window.scrollTo(0,0);
});
$("retryWrong").addEventListener("click", () => {
  const pool = S.qs.filter((q,i) => S.ans[i] !== null && S.ans[i] !== q.a);
  if(pool.length){ const keep = cfg.count; cfg.count = pool.length; startSession(pool, "ulang"); cfg.count = keep; }
});

document.addEventListener("keydown", e => {
  if($("quiz").classList.contains("hidden")) return;
  if(e.target.tagName === "INPUT") return;
  const k = e.key.toUpperCase();
  const li = LET.indexOf(k);
  const ni = "12345".indexOf(k);
  if(li > -1){ e.preventDefault(); pick(li); }
  else if(ni > -1){ e.preventDefault(); pick(ni); }
  else if(e.key === "Enter" || e.key === "ArrowRight"){ e.preventDefault(); move(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); move(-1); }
});

/* ---------------- init ---------------- */
(async function init(){
  const saved = await store.get("neuro:cfg", null);
  if(saved) cfg = {...DEFAULT_CFG, ...saved};
  if(!Array.isArray(cfg.topics) || !cfg.topics.length) cfg.topics = Object.keys(TOPICS);
  hist = await store.get("neuro:hist", []) || [];
  wrongSet = await store.get("neuro:wrong", {}) || {};
  $("count").value = cfg.count;
  renderTopics(); renderPresets(); renderToggles(); renderPool(); renderHistory();
})();
</script>
